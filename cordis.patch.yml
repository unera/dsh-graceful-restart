# Bundle layer for @dr-co/dsh-graceful-restart.
#
# Two identities, and both are load-bearing:
#   - `name` is the module specifier and must equal package.json `name`, because
#     the client-modules scan matches the nearest manifest name against it — that
#     is how the browser card gets loaded at all;
#   - `id` is the Loader entry, and the settings namespace IS the entry id (the
#     settings service answers "Plugin entry <id> has no volatile fields"), so it
#     stays short and the browser card asks configForms for it.
- insert:
    - id: dsh-graceful-restart
      name: '@dr-co/dsh-graceful-restart'
